name: build-installer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installer:
    name: .deb installer (podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build .deb installer
        run: tools/build-installer.sh

      - name: Show built installer
        run: ls -lh installers/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: silkmark-deb
          path: installers/*.deb
          if-no-files-found: error
