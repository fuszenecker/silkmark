name: build-windows

# CI build of the SilkMark Windows installer (.exe) on every push to main and
# on pull requests. The installer is built directly on a windows-latest runner
# using the MSYS2 MINGW64 subsystem, which provides the GTK4 / libcurl /
# gdk-pixbuf development stack that build.rs resolves via pkg-config.
#
# The resulting setup.exe is uploaded as a workflow artifact for download; the
# actual release assets are published by release.yml on a version tag.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installer:
    name: .exe installer (MSYS2/GTK4)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-pkgconf

      - name: Build Windows installer
        shell: msys2 {0}
        run: tools/build-windows-installer.sh

      - name: Show built installer
        shell: bash
        run: ls -lh installers/

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: silkmark-exe
          path: installers/*.exe
          if-no-files-found: error
