name: release

# Push a version tag (e.g. v1.0.4) to build the .deb and .exe and attach them
# to a GitHub Release. Release assets are served as raw files — no zip — so
# each gets a permanent direct-download URL. Stable copies are also uploaded so
# the `latest` download URLs always resolve:
#   https://github.com/hg2ecz/silkmark/releases/download/<tag>/silkmark_<ver>_<arch>.deb
#   https://github.com/hg2ecz/silkmark/releases/download/<tag>/silkmark_<ver>_win64-setup.exe
#   https://github.com/hg2ecz/silkmark/releases/latest/download/silkmark.deb
#   https://github.com/hg2ecz/silkmark/releases/latest/download/silkmark-win64-setup.exe
#
# The `release` job builds the .deb and creates the GitHub Release; the
# `release-windows` job then builds the .exe and attaches it to that release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the Release and upload assets

jobs:
  release:
    name: Publish .deb release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Verify tag version matches Cargo.toml
        run: |
          # Strip a leading "v" and any SemVer build metadata (+...) so a tag
          # like v1.0.5 matches a Cargo.toml version like 1.0.5+1.
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%+*}"
          CARGO=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          CARGO="${CARGO%%+*}"
          echo "tag=$TAG cargo=$CARGO"
          if [ "$TAG" != "$CARGO" ]; then
            echo "error: git tag version ($TAG) does not match Cargo.toml version ($CARGO)" >&2
            echo "fix: bump version in Cargo.toml to $TAG, commit, then push the tag." >&2
            exit 1
          fi

      - name: Build .deb installer
        run: tools/build-installer.sh

      - name: Show built installer
        run: ls -lh installers/

      - name: Stage stable download name
        run: cp installers/silkmark_*.deb installers/silkmark.deb

      - name: Create release and upload .deb
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/silkmark.deb
            installers/silkmark_*.deb
          generate_release_notes: true

  release-windows:
    name: Publish .exe to release
    needs: release  # the release must already exist so we can upload to it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-pkgconf

      - name: Build Windows installer
        shell: msys2 {0}
        run: tools/build-windows-installer.sh

      - name: Show built installer
        shell: bash
        run: ls -lh installers/

      - name: Upload .exe to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          mapfile -t exe_files < <(find installers -name '*.exe' | sort)
          if [ "${#exe_files[@]}" -lt 2 ]; then
            echo "Expected versioned + stable .exe files; found ${#exe_files[@]}:" >&2
            printf '  %s\n' "${exe_files[@]}" >&2
            exit 1
          fi
          printf 'Exe assets to publish:\n'
          printf '  %s\n' "${exe_files[@]}"
          gh release upload "${GITHUB_REF_NAME}" --clobber "${exe_files[@]}"
