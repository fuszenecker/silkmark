name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: cargo build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cargo rustc pkg-config \
            libgtk-4-dev libgdk-pixbuf-2.0-dev libcurl4-openssl-dev

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test
        run: cargo test
